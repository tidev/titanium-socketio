name: API Docs
on:
  push:
    paths:
    - 'apidoc/**'
  pull_request:
    paths:
    - 'apidoc/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    name: Docs
    steps:
    - uses: actions/checkout@v7

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - run: npm ci
      name: Install dependencies

    - run: npm run lint:docs
      name: Lint
